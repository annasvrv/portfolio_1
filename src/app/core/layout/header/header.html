<header class="header" [class.header--menu-open]="isOpen()">
  <div class="header__bar">
    <a
      class="header__brand"
      routerLink="/"
      title="Homepage"
      (click)="close()"
    >
      <!--
        Logo: PNG (1x + 2x retina) by default. SVG variant is also
        served at /logo.svg — to compare, swap the src/srcset to that.
      -->
      <img
        class="header__brand-logo"
        src="/logo.png"
        srcset="/logo.png 1x, /logo@2x.png 2x"
        alt=""
        width="32"
        height="32"
        decoding="async"
        aria-hidden="true"
      />
      <span class="header__brand-name">AnnaS</span>
    </a>

    <aside
      id="primary-menu"
      class="header__sidebar"
      [attr.aria-hidden]="!isOpen()"
      #sidebar
    >
      <nav class="header__nav" aria-label="Primary">
        <ul class="header__menu" role="list">
          @for (item of navItems; track item.path) {
            <li class="header__menu-item">
              <a
                class="header__link"
                [routerLink]="item.path"
                [routerLinkActive]="'header__link--active'"
                [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                [title]="item.title"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </aside>

    <button
      type="button"
      class="header__toggle"
      [attr.aria-expanded]="isOpen()"
      aria-controls="primary-menu"
      aria-label="Toggle navigation menu"
      (click)="toggle()"
      #toggleButton
    >
      <hrb-icon [name]="isOpen() ? 'close' : 'menu'" [size]="24" />
    </button>
  </div>

  <div
    class="header__backdrop"
    aria-hidden="true"
    (click)="close()"
  ></div>
</header>
