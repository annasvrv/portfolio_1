<header class="header" [class.header--menu-open]="isOpen()">
  <div class="header__bar">
    <a
      class="header__brand"
      routerLink="/"
      title="Homepage"
      (click)="close()"
    >
      AnnaS
    </a>

    <aside
      id="primary-menu"
      class="header__sidebar"
      [attr.aria-hidden]="!isOpen()"
    >
      <nav class="header__nav" aria-label="Primary">
        <ul class="header__menu" role="list">
          @for (item of navItems; track item.path) {
            <li class="header__menu-item">
              <a
                class="header__link"
                [routerLink]="item.path"
                [routerLinkActive]="'header__link--active'"
                [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                [title]="item.title"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </aside>

    <button
      type="button"
      class="header__toggle"
      [attr.aria-expanded]="isOpen()"
      aria-controls="primary-menu"
      aria-label="Toggle navigation menu"
      (click)="toggle()"
    >
      <hrb-icon [name]="isOpen() ? 'close' : 'menu'" [size]="24" />
    </button>
  </div>

  <div
    class="header__backdrop"
    aria-hidden="true"
    (click)="close()"
  ></div>
</header>
