@let c = certificate();

<figure class="certificate-card">
  <picture class="certificate-card__media">
    <!-- TODO: add <source type="image/webp"> when WebP variants are exported -->
    <img
      class="certificate-card__image"
      [src]="c.image.src"
      [alt]="c.image.alt"
      [width]="c.image.width"
      [height]="c.image.height"
      [loading]="loading()"
      decoding="async"
    />
  </picture>
  <figcaption class="certificate-card__caption">
    <span class="certificate-card__title">{{ c.title }}</span>
    <span class="certificate-card__issuer">{{ c.issuer }}</span>
  </figcaption>
</figure>
