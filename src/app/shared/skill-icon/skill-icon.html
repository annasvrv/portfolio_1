@let s = skill();

<figure class="skill-icon">
  <img
    class="skill-icon__image"
    [src]="s.image.src"
    [alt]="s.image.alt"
    [width]="s.image.width"
    [height]="s.image.height"
    loading="lazy"
    decoding="async"
  />
  <figcaption class="skill-icon__label">{{ s.name }}</figcaption>
</figure>
