<aside class="contact-cta" aria-labelledby="contact-cta-heading">
  <div class="contact-cta__copy">
    <h2 class="contact-cta__heading" id="contact-cta-heading">
      {{ heading() }}
    </h2>
    <p class="contact-cta__subheading">{{ subheading() }}</p>
  </div>

  <a
    class="btn btn--branding contact-cta__action"
    [routerLink]="ctaPath()"
  >
    {{ ctaLabel() }}
  </a>
</aside>
