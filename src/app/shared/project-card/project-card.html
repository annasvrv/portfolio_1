@let p = project();

<article class="project-card" [class]="variantClass()">
  <picture class="project-card__media">
    <!-- TODO: add <source type="image/webp"> when WebP variants are exported -->
    <img
      class="project-card__image"
      [src]="p.image.src"
      [alt]="p.image.alt"
      [width]="p.image.width"
      [height]="p.image.height"
      [loading]="isLcp() ? 'eager' : 'lazy'"
      [attr.fetchpriority]="isLcp() ? 'high' : null"
      decoding="async"
    />
  </picture>

  <div class="project-card__body">
    <h3 class="project-card__title">{{ p.title }}</h3>
    <p class="project-card__description">{{ p.description }}</p>

    <a
      class="btn btn--branding-outline project-card__cta"
      [href]="p.demoUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ ctaLabel() }}
    </a>
  </div>
</article>
